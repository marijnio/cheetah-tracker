version: "3.8"

services:
  cheetah-tracker:
    container_name: cheetah-tracker
    # Pre-built image hosted on GitHub Container Registry (zero CPU compile on NAS!)
    image: ghcr.io/marijnio/cheetah-tracker:latest
    restart: unless-stopped
    ports:
      # Maps port 3000 on your NAS (change left side to 3080:3000 if 3000 is occupied)
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Persists SQLite database and cache on your Synology disk
      - ./data:/app/data
